<!DOCTYPE html>
<html lang="en">

<head>
    <title>System Oscilloscope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff416c;
            --bg-dark: #0a0a0c;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a, #000);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            width: 850px;
            text-align: center;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        h2 {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
        }

        canvas {
            background: #000;
            border-radius: 16px;
            width: 100%;
            /* Visual width */
            height: 300px;
            /* Visual height */
            display: block;
            margin: 10px 0 30px 0;
            border: 1px solid #222;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 14px 35px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #startBtn {
            background: linear-gradient(135deg, #00f2ff, #0072ff);
            color: #000;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3);
        }

        #stopBtn {
            background: #222;
            color: #666;
            pointer-events: none;
        }

        #stopBtn.active {
            background: var(--neon-red);
            color: white;
            pointer-events: auto;
            opacity: 1;
        }

        #stopBtn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-box">
            <h2>System Oscilloscope</h2>
            <div id="statusIndicator" style="color: #444; font-size: 0.7rem; font-weight: 900;">IDLE</div>
        </div>

        <canvas id="visualizer"></canvas>

        <div class="button-group">
            <button id="startBtn">Start Monitor</button>
            <button id="stopBtn">Stop</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("visualizer");
        const canvasCtx = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusIndicator = document.getElementById("statusIndicator");

        let audioCtx, analyser, dataArray, bufferLength, source, stream, animationId;
        let isRunning = false;

        // FIX FOR BLURRY LINE: Scale canvas for high-pixel-density screens
        function adjustCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvasCtx.scale(dpr, dpr);
            return {
                w: rect.width,
                h: rect.height
            };
        }

        startBtn.addEventListener("click", async () => {
            if (isRunning) return;

            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);

                analyser.fftSize = 2048;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                isRunning = true;
                startBtn.style.display = "none";
                stopBtn.classList.add("active");
                statusIndicator.innerText = "SIGNAL DETECTED";
                statusIndicator.style.color = "#ff416c";

                const dims = adjustCanvas();
                draw(dims.w, dims.h);
            } catch (err) {
                alert("Microphone access denied!");
            }
        });

        stopBtn.addEventListener("click", () => {
            cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (audioCtx) audioCtx.close();

            isRunning = false;
            startBtn.style.display = "block";
            stopBtn.classList.remove("active");
            statusIndicator.innerText = "IDLE";
            statusIndicator.style.color = "#444";

            // Clear the screen
            const rect = canvas.getBoundingClientRect();
            canvasCtx.fillStyle = "#000";
            canvasCtx.fillRect(0, 0, rect.width, rect.height);
        });

        function draw(WIDTH, HEIGHT) {
            animationId = requestAnimationFrame(() => draw(WIDTH, HEIGHT));
            analyser.getByteTimeDomainData(dataArray);

            // Dark Background
            canvasCtx.fillStyle = "#0a0a0c";
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw Blinking Red Dot
            if (Math.floor(Date.now() / 500) % 2) {
                canvasCtx.beginPath();
                canvasCtx.arc(WIDTH - 30, 30, 6, 0, Math.PI * 2);
                canvasCtx.fillStyle = "#ff0000";
                canvasCtx.fill();
            }

            // YOUR ORIGINAL LINE DRAWING LOGIC (unmodified)
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = "#00f2ff";
            canvasCtx.shadowBlur = 10;
            canvasCtx.shadowColor = "#00f2ff";
            canvasCtx.beginPath();

            const sliceWidth = WIDTH / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * (HEIGHT / 2);

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                x += sliceWidth;
            }

            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;
        }
    </script>
</body>

</html>
