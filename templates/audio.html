<!DOCTYPE html>
<html lang="en">
<head>
    <title>System Hub | Select Module</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-amber: #ffb300;
            --neon-red: #ff416c;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a, #000);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 50px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            width: 900px;
            max-width: 95%;
            text-align: center;
        }

        h1 {
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--neon-blue);
            margin-bottom: 10px;
            font-weight: 900;
        }

        .selector-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden; /* Important for the seamless wave loop */
        }

        .module-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        /* --- DRAWN CSS ICONS --- */
        
        .icon-box {
            width: 80px;
            height: 60px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Spectrum Icon (Animated Bars) */
        .draw-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
        }
        .draw-bars div {
            width: 6px;
            background: var(--neon-amber);
            box-shadow: 0 0 10px var(--neon-amber);
            border-radius: 2px;
            animation: bar-dance 1.5s infinite ease-in-out;
        }
        @keyframes bar-dance {
            0%, 100% { height: 30%; }
            50% { height: 90%; }
        }

        /* --- FIXED SEAMLESS OSCILLOSCOPE ICON --- */
        .wave-viewport {
            width: 100px;
            height: 40px;
            overflow: hidden;
            position: relative;
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        .wave-track {
            display: flex;
            width: 200px; /* Two waves side-by-side */
            animation: wave-scroll 2s linear infinite;
        }

        .draw-wave-svg {
            width: 100px;
            height: 40px;
            flex-shrink: 0;
        }

        .draw-wave-svg path {
            stroke: var(--neon-blue);
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
        }

        @keyframes wave-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-100px); }
        }

        /* Data Logger Icon (Grid Document) */
        .draw-log {
            width: 45px;
            height: 55px;
            border: 2px solid #555;
            border-radius: 4px;
            position: relative;
            background: repeating-linear-gradient(#222 0 1px, transparent 1px 10px);
        }
        .draw-log::after {
            content: '';
            position: absolute;
            top: 10px; left: 5px;
            width: 70%; height: 3px;
            background: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        .module-name {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .module-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.5;
        }

        .system-status {
            margin-top: 50px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>System Core</h1>
            <p style="color: rgba(255, 255, 255, 0.4); font-size: 0.85rem;">Hardware Interface Selector</p>
        </div>

        <div class="selector-grid">
            <a href="/audio/bar" class="module-card">
                <div class="icon-box">
                    <div class="draw-bars">
                        <div style="animation-delay: 0.1s"></div>
                        <div style="animation-delay: 0.3s"></div>
                        <div style="animation-delay: 0.2s"></div>
                        <div style="animation-delay: 0.4s"></div>
                        <div style="animation-delay: 0.1s"></div>
                    </div>
                </div>
                <div class="module-name" style="color: var(--neon-amber);">Spectrum</div>
                <div class="module-desc">Frequency distribution monitoring with peak detection.</div>
            </a>

            <a href="/audio/line" class="module-card">
                <div class="icon-box">
                    <div class="wave-viewport">
                        <div class="wave-track">
                            <svg class="draw-wave-svg" viewBox="0 0 100 40">
                                <path d="M0,20 C20,0 30,40 50,20 C70,0 80,40 100,20" />
                            </svg>
                            <svg class="draw-wave-svg" viewBox="0 0 100 40">
                                <path d="M0,20 C20,0 30,40 50,20 C70,0 80,40 100,20" />
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="module-name" style="color: var(--neon-blue);">Oscilloscope</div>
                <div class="module-desc">Time-domain waveform visualization for signal stability.</div>
            </a>

            <a href="/audio/logger" class="module-card">
                <div class="icon-box">
                    <div class="draw-log"></div>
                </div>
                <div class="module-name" style="color: var(--neon-red);">Data Logger</div>
                <div class="module-desc">Raw telemetry export and signal archive reconstruction.</div>
            </a>
        </div>

        <div class="system-status">
            SECURE_LINK // TERMINAL_READY // 2026_REVISION
        </div>
    </div>

</body>
</html>
